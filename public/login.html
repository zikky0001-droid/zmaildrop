<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open a ZMAIL Drop mailbox.">
  <title>ZMAIL Drop — Open Inbox</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-shell">
  <main class="center-page">
    <a class="back-link" href="/">← Back to ZMAIL Drop</a>
    <section class="login-card">
      <div class="brand-mark small">Z</div>
      <span class="eyebrow">OPEN MAILBOX</span>
      <h1>Where should we look?</h1>
      <p class="muted">Enter the Maildrop username you want to receive or check mail for.</p>

      <form id="mailbox-form" class="mailbox-form">
        <label for="mailbox">Mailbox username</label>
        <div class="input-group">
          <input id="mailbox" name="mailbox" type="text" maxlength="64"
                 autocomplete="off" autocapitalize="none" spellcheck="false"
                 placeholder="devzikky123" required>
          <span>@maildrop.cc</span>
        </div>
        <p class="field-hint">Use letters, numbers, dots, hyphens, or underscores.</p>
        <button class="btn btn-primary btn-wide" type="submit">Open inbox <span>→</span></button>
        <div id="login-error" class="form-error" hidden></div>
      </form>
    </section>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
